name: Bootstrap upstream history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Import upstream history with downstream workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO='https://github.com/Javis603/token-monitor.git'
          UPSTREAM_SHA='0b17b1ec53ccd60508a645144ccb7db74027168c'
          TARGET_BRANCH='import/upstream-v0.53.0'

          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"

          git checkout --detach "$UPSTREAM_SHA"

          # GitHub Apps cannot introduce upstream workflow files without the
          # workflows permission. Token Lens intentionally owns its own CI anyway,
          # so remove only the active upstream workflows while preserving the exact
          # upstream release commit as this downstream import commit's parent.
          rm -rf .github/workflows
          git add -A
          git config user.name 'token-lens-bootstrap'
          git config user.email 'token-lens-bootstrap@users.noreply.github.com'
          git commit -m 'chore(downstream): strip upstream workflows from imported baseline'

          test "$(git rev-parse HEAD^)" = "$UPSTREAM_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force

          echo "Imported upstream parent $UPSTREAM_SHA to $TARGET_BRANCH"
