name: Build Token Lens v2 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/v2-*'
    tags:
      - 'token-lens-v2-*'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install locked dependencies
        run: npm ci

      - name: Check packaging helpers
        run: npm run test:frontend

      - name: Build unsigned installer and portable bundle
        run: npm run package:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: token-lens-v2-windows-x64
          path: |
            dist-v2/Token-Lens-Setup-*.exe
            dist-v2/Token-Lens-*-portable.zip
            dist-v2/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
