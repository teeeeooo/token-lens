[package]
name = "token-lens"
version = "2.0.0-alpha.0"
description = "Lightweight desktop usage and quota monitor for Codex, Claude, and Antigravity"
authors = ["Token Lens contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "token_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
