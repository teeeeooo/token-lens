[package]
name = "token-lens"
version = "2.0.0-alpha.0"
description = "Lightweight desktop usage and quota monitor for Codex, Claude, Gemini CLI, and Antigravity"
authors = ["Token Lens contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "token_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
minreq = { version = "=2.14.1", default-features = false, features = ["https-rustls", "json-using-serde"] }
rustls = { version = "=0.21.12", features = ["dangerous_configuration"] }
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
